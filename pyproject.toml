[project]
name = "rag-demo"
version = "0.1.0"
description = "Production-minded RAG service: retrieval evals, citations, cost tracking, deployable to AWS (Bedrock + Lambda) with Terraform."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic>=2.6",
    "mangum>=0.17",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "uvicorn>=0.29"]

[project.scripts]
rag-ingest = "rag_demo.ingest:main"
rag-eval = "rag_demo.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
